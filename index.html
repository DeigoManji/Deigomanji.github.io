<!doctype html>
<title>Melodía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:           #FAF7FC;
  --surface:      #F2EDF8;
  --surface-2:    #E8DFEF;
  --border:       #DDD5E8;
  --text:         #1A1520;
  --text-2:       #7A6B8A;
  --accent:       #B85A75;
  --accent-glow:  rgba(184,90,117,.28);
  --note-bg:      #EDE6F5;
  --note-border:  #C9B8DC;
  --range-fill:   #B85A75;
  --shadow:       0 12px 40px rgba(30,15,40,.13);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:           #16111E;
    --surface:      #211A2A;
    --surface-2:    #2C2438;
    --border:       #3A3048;
    --text:         #F0EAF5;
    --text-2:       #9B8FAD;
    --accent:       #E8A0BF;
    --accent-glow:  rgba(232,160,191,.22);
    --note-bg:      #271E35;
    --note-border:  #4A3A5E;
    --range-fill:   #E8A0BF;
    --shadow:       0 12px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --bg:           #16111E;
  --surface:      #211A2A;
  --surface-2:    #2C2438;
  --border:       #3A3048;
  --text:         #F0EAF5;
  --text-2:       #9B8FAD;
  --accent:       #E8A0BF;
  --accent-glow:  rgba(232,160,191,.22);
  --note-bg:      #271E35;
  --note-border:  #4A3A5E;
  --range-fill:   #E8A0BF;
  --shadow:       0 12px 40px rgba(0,0,0,.45);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  padding: 24px 16px 48px;
}

.wrap {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ── Cover ── */
.cover-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.cover-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .35s;
}
.cover-img.fade { opacity: 0; }

/* ── Player card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 22px 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-shadow: var(--shadow);
}

.song-info { text-align: center; }
.song-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.35rem;
  font-weight: 600;
  line-height: 1.25;
  text-wrap: balance;
  color: var(--text);
}
.song-artist {
  margin-top: 3px;
  font-size: .8rem;
  font-weight: 300;
  color: var(--text-2);
  letter-spacing: .07em;
  text-transform: uppercase;
}

/* ── Seek ── */
.seek-section { display: flex; flex-direction: column; gap: 7px; }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  outline: none;
  cursor: pointer;
  background: transparent;
}
.seek-bar { height: 4px; }
.seek-bar::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 99px;
  background: linear-gradient(
    to right,
    var(--range-fill) 0%,
    var(--range-fill) var(--pct, 0%),
    var(--border) var(--pct, 0%),
    var(--border) 100%
  );
}
.seek-bar::-moz-range-track {
  height: 4px;
  border-radius: 99px;
  background: var(--border);
}
.seek-bar::-moz-range-progress {
  height: 4px;
  border-radius: 99px;
  background: var(--range-fill);
}
.seek-bar::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  margin-top: -5px;
  background: var(--accent);
  border-radius: 50%;
  transition: transform .15s;
}
.seek-bar::-webkit-slider-thumb:hover { transform: scale(1.35); }
.seek-bar::-moz-range-thumb {
  width: 14px; height: 14px;
  background: var(--accent);
  border: none;
  border-radius: 50%;
}

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: .72rem;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}

/* ── Controls ── */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.btn-icon {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 9px;
  border-radius: 50%;
  transition: color .18s, background .18s;
}
.btn-icon:hover { color: var(--text); background: var(--surface-2); }
.btn-icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-icon.on { color: var(--accent); }

.btn-play {
  width: 58px; height: 58px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 18px var(--accent-glow);
  transition: transform .15s, box-shadow .2s;
}
.btn-play:hover { transform: scale(1.06); box-shadow: 0 6px 24px var(--accent-glow); }
.btn-play:active { transform: scale(.95); }
.btn-play:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ── Volume ── */
.vol-row {
  display: flex;
  align-items: center;
  gap: 9px;
}
.vol-icon { color: var(--text-2); flex-shrink: 0; }
.vol-bar { height: 3px; flex: 1; }
.vol-bar::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 99px;
  background: linear-gradient(
    to right,
    var(--text-2) 0%,
    var(--text-2) var(--vpct, 80%),
    var(--border) var(--vpct, 80%),
    var(--border) 100%
  );
}
.vol-bar::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  margin-top: -4.5px;
  background: var(--text-2);
  border-radius: 50%;
  transition: background .2s;
}
.vol-bar::-webkit-slider-thumb:hover { background: var(--accent); }
.vol-bar::-moz-range-track { height: 3px; border-radius: 99px; background: var(--border); }
.vol-bar::-moz-range-progress { height: 3px; border-radius: 99px; background: var(--text-2); }
.vol-bar::-moz-range-thumb {
  width: 12px; height: 12px;
  background: var(--text-2);
  border: none;
  border-radius: 50%;
}

/* ── Note ── */
.note-card {
  background: var(--note-bg);
  border: 1px solid var(--note-border);
  border-radius: 20px;
  padding: 18px 20px 20px;
}
.note-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-2);
  margin-bottom: 10px;
}
.note-label svg { flex-shrink: 0; }
.note-text {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: .96rem;
  line-height: 1.7;
  color: var(--text);
  transition: opacity .28s;
}
.note-text.fade { opacity: 0; }

/* ── Playlist ── */
.playlist {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.pl-header {
  padding: 13px 20px;
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-2);
  border-bottom: 1px solid var(--border);
}
.pl-list {
  list-style: none;
  max-height: 300px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.pl-list::-webkit-scrollbar { width: 4px; }
.pl-list::-webkit-scrollbar-track { background: transparent; }
.pl-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.pl-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 20px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .14s;
}
.pl-item:last-child { border-bottom: none; }
.pl-item:hover { background: var(--surface-2); }
.pl-item.active { background: var(--surface-2); }
.pl-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.pl-num {
  font-size: .73rem;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  width: 18px;
  text-align: center;
  flex-shrink: 0;
}
.pl-item.active .pl-num { color: var(--accent); }

.pl-thumb {
  width: 42px; height: 42px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}
.pl-info { flex: 1; min-width: 0; }
.pl-title {
  font-size: .875rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.pl-item.active .pl-title { color: var(--accent); }
.pl-artist {
  font-size: .75rem;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>

<div class="wrap">
  <div class="cover-wrap">
    <img id="coverImg" class="cover-img" src="" alt="">
  </div>

  <div class="card">
    <div class="song-info">
      <div id="songTitle" class="song-title">—</div>
      <div id="songArtist" class="song-artist">—</div>
    </div>

    <div class="seek-section">
      <input type="range" id="seekBar" class="seek-bar" min="0" max="100" step="0.1" value="0" aria-label="Progreso">
      <div class="time-row">
        <span id="timeElapsed">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-icon" id="btnShuffle" aria-label="Aleatorio" title="Aleatorio">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
      </button>

      <button class="btn-icon" id="btnPrev" aria-label="Anterior">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>

      <button class="btn-play" id="btnPlay" aria-label="Reproducir">
        <svg id="playIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <button class="btn-icon" id="btnNext" aria-label="Siguiente">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/>
        </svg>
      </button>

      <button class="btn-icon" id="btnRepeat" aria-label="Repetir" title="Repetir">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
    </div>

    <div class="vol-row">
      <svg class="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
      <input type="range" id="volBar" class="vol-bar" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
      <svg class="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </div>
  </div>

  <div class="note-card">
    <div class="note-label">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.84 1.83 3.75 3.75M3 17.25V21h3.75L17.81 9.93l-3.75-3.75L3 17.25z"/>
      </svg>
      Nota de esta canción
    </div>
    <p id="noteText" class="note-text">—</p>
  </div>

  <div class="playlist">
    <div class="pl-header">Lista de reproducción</div>
    <ul id="plList" class="pl-list"></ul>
  </div>
</div>

<audio id="audioEl"></audio>

<script>
// ═══════════════════════════════════════════════════
//  CANCIONES — reemplaza estos datos con los tuyos
// ═══════════════════════════════════════════════════
const songs = [
  {
    title: "Night Changes",
    artist: "One Direction",
    src: "https://raw.githubusercontent.com/Deigomanji/Deigomanji.github.io/main/One%20Direction%20-%20Night%20Changes.mp3",
    cover: "https://picsum.photos/seed/s1/600/600",
    note: "Esta canción me recuerda cada vez que el tiempo parecía detenerse y todo lo que importaba cabía en un solo momento contigo."
  },
  {
    title: "Nombre de la Canción 2",
    artist: "Artista",
    src: "URL_DEL_AUDIO_2.mp3",
    cover: "https://picsum.photos/seed/s2/600/600",
    note: "La escuché por primera vez y pensé en ti. Ahora ya no puedo separarlas: tu nombre y esta melodía son lo mismo."
  },
  {
    title: "Nombre de la Canción 3",
    artist: "Artista",
    src: "URL_DEL_AUDIO_3.mp3",
    cover: "https://picsum.photos/seed/s3/600/600",
    note: "Hay canciones que no se eligen, simplemente llegan. Esta llegó en el momento exacto en que más la necesitaba."
  },
  {
    title: "Nombre de la Canción 4",
    artist: "Artista",
    src: "URL_DEL_AUDIO_4.mp3",
    cover: "https://picsum.photos/seed/s4/600/600",
    note: "Guarda esta nota para recordar lo que sentiste la primera vez. Vale la pena no olvidarlo."
  }
];
// ═══════════════════════════════════════════════════

let cur = 0, playing = false, shuffle = false, repeat = false;

const audio     = document.getElementById('audioEl');
const coverImg  = document.getElementById('coverImg');
const songTitle = document.getElementById('songTitle');
const songArtist= document.getElementById('songArtist');
const noteText  = document.getElementById('noteText');
const seekBar   = document.getElementById('seekBar');
const elapsed   = document.getElementById('timeElapsed');
const duration  = document.getElementById('timeDuration');
const volBar    = document.getElementById('volBar');
const btnPlay   = document.getElementById('btnPlay');
const playIcon  = document.getElementById('playIcon');
const btnShuffle= document.getElementById('btnShuffle');
const btnRepeat = document.getElementById('btnRepeat');
const plList    = document.getElementById('plList');

const PLAY_PATH  = 'M8 5v14l11-7z';
const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

function updateSeekFill() {
  const pct = seekBar.max > 0 ? (seekBar.value / seekBar.max * 100).toFixed(1) + '%' : '0%';
  seekBar.style.setProperty('--pct', pct);
}

function updateVolFill() {
  const pct = (volBar.value * 100).toFixed(1) + '%';
  volBar.style.setProperty('--vpct', pct);
}

function loadSong(i, autoplay) {
  const s = songs[i];
  // fade cover
  coverImg.classList.add('fade');
  setTimeout(() => {
    coverImg.src = s.cover;
    coverImg.alt = `${s.title} — ${s.artist}`;
    coverImg.classList.remove('fade');
  }, 200);
  songTitle.textContent  = s.title;
  songArtist.textContent = s.artist;
  // fade note
  noteText.classList.add('fade');
  setTimeout(() => {
    noteText.textContent = s.note;
    noteText.classList.remove('fade');
  }, 200);
  audio.src = s.src;
  seekBar.value = 0;
  updateSeekFill();
  elapsed.textContent  = '0:00';
  duration.textContent = '0:00';
  updatePlaylist();
  if (autoplay) audio.play().catch(() => {});
}

function updatePlaylist() {
  plList.querySelectorAll('.pl-item').forEach((el, i) => {
    el.classList.toggle('active', i === cur);
    el.querySelector('.pl-num').textContent = i === cur ? '▶' : (i + 1);
  });
}

function setPlayState(state) {
  playing = state;
  playIcon.setAttribute('d', state ? PAUSE_PATH : PLAY_PATH);
}

function next() {
  cur = shuffle
    ? (songs.length > 1 ? (() => { let n; do { n = Math.floor(Math.random()*songs.length); } while(n===cur); return n; })() : 0)
    : (cur + 1) % songs.length;
  loadSong(cur, playing);
}

function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  cur = (cur - 1 + songs.length) % songs.length;
  loadSong(cur, playing);
}

// Audio events
audio.addEventListener('play',  () => setPlayState(true));
audio.addEventListener('pause', () => setPlayState(false));
audio.addEventListener('ended', () => {
  if (repeat) { audio.currentTime = 0; audio.play().catch(()=>{}); }
  else next();
});
audio.addEventListener('loadedmetadata', () => { duration.textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  seekBar.value = pct;
  updateSeekFill();
  elapsed.textContent = fmt(audio.currentTime);
});

// Controls
btnPlay.addEventListener('click', () => {
  playing ? audio.pause() : audio.play().catch(() => {});
});
document.getElementById('btnNext').addEventListener('click', next);
document.getElementById('btnPrev').addEventListener('click', prev);

btnShuffle.addEventListener('click', () => {
  shuffle = !shuffle;
  btnShuffle.classList.toggle('on', shuffle);
});
btnRepeat.addEventListener('click', () => {
  repeat = !repeat;
  btnRepeat.classList.toggle('on', repeat);
});

seekBar.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
  updateSeekFill();
});

volBar.addEventListener('input', () => {
  audio.volume = volBar.value;
  updateVolFill();
});
audio.volume = volBar.value;
updateVolFill();

// Build playlist
songs.forEach((s, i) => {
  const li = document.createElement('li');
  li.className = 'pl-item';
  li.tabIndex = 0;
  li.setAttribute('role', 'button');
  li.setAttribute('aria-label', `Reproducir ${s.title}`);
  li.innerHTML = `
    <span class="pl-num">${i+1}</span>
    <img class="pl-thumb" src="${s.cover}" alt="" loading="lazy">
    <div class="pl-info">
      <div class="pl-title">${s.title}</div>
      <div class="pl-artist">${s.artist}</div>
    </div>`;
  li.addEventListener('click', () => { cur = i; loadSong(i, true); });
  li.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); li.click(); } });
  plList.appendChild(li);
});

// Init
loadSong(0, false);
</script>
