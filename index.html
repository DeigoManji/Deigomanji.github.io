<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Melodía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:           #FDF9F4;
  --surface:      #F4EDE2;
  --surface-2:    #EAE0D4;
  --border:       #D8CCBE;
  --text:         #1A1008;
  --text-2:       #8A7060;
  --accent:       #C8102E;
  --accent-glow:  rgba(200,16,46,.25);
  --note-bg:      #FEF2F2;
  --note-border:  #F0CACA;
  --range-fill:   #C8102E;
  --shadow:       0 12px 40px rgba(20,8,0,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:           #0C1018;
    --surface:      #131C2A;
    --surface-2:    #1C2838;
    --border:       #263448;
    --text:         #F0EAE0;
    --text-2:       #8090A8;
    --accent:       #E83050;
    --accent-glow:  rgba(232,48,80,.28);
    --note-bg:      #160E18;
    --note-border:  #3A2030;
    --range-fill:   #E83050;
    --shadow:       0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:           #0C1018;
  --surface:      #131C2A;
  --surface-2:    #1C2838;
  --border:       #263448;
  --text:         #F0EAE0;
  --text-2:       #8090A8;
  --accent:       #E83050;
  --accent-glow:  rgba(232,48,80,.28);
  --note-bg:      #160E18;
  --note-border:  #3A2030;
  --range-fill:   #E83050;
  --shadow:       0 12px 40px rgba(0,0,0,.5);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  height: 100dvh;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

/* Zona de scroll — todo menos la bottom nav */
.scroll-area {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 16px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.wrap {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Views ── */
.view { display: none; }
.view.active { display: flex; flex-direction: column; gap: 12px; }

/* Vista playlist ocupa toda la altura disponible */
#viewPlaylist {
  min-height: 100%;
}
#viewPlaylist .playlist {
  flex: 1;
}
#viewPlaylist .pl-list {
  max-height: none;
}

/* ── Bottom nav ── */
.bottom-nav {
  flex-shrink: 0;
  width: 100%;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1;
  max-width: 210px;
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 10px 0 12px;
  color: var(--text-2);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: .68rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  transition: color .18s;
}
.nav-btn.active { color: var(--accent); }
.nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ── Cover ── */
.cover-wrap {
  position: relative;
  width: min(55vw, 260px);
  height: min(55vw, 260px);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
  align-self: center;
  flex-shrink: 0;
}
.cover-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  transition: opacity .35s;
}
.cover-img.fade { opacity: 0; }

/* ── Player card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 18px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow);
}

.song-info { text-align: center; }
.song-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.35rem;
  font-weight: 600;
  line-height: 1.25;
  text-wrap: balance;
  color: var(--text);
}
.song-artist {
  margin-top: 3px;
  font-size: .8rem;
  font-weight: 300;
  color: var(--text-2);
  letter-spacing: .07em;
  text-transform: uppercase;
}

/* ── Seek ── */
.seek-section { display: flex; flex-direction: column; gap: 7px; }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  outline: none;
  cursor: pointer;
  background: transparent;
}
.seek-bar { height: 4px; }
.seek-bar::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 99px;
  background: linear-gradient(
    to right,
    var(--range-fill) 0%,
    var(--range-fill) var(--pct, 0%),
    var(--border) var(--pct, 0%),
    var(--border) 100%
  );
}
.seek-bar::-moz-range-track {
  height: 4px;
  border-radius: 99px;
  background: var(--border);
}
.seek-bar::-moz-range-progress {
  height: 4px;
  border-radius: 99px;
  background: var(--range-fill);
}
.seek-bar::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  margin-top: -5px;
  background: var(--accent);
  border-radius: 50%;
  transition: transform .15s;
}
.seek-bar::-webkit-slider-thumb:hover { transform: scale(1.35); }
.seek-bar::-moz-range-thumb {
  width: 14px; height: 14px;
  background: var(--accent);
  border: none;
  border-radius: 50%;
}

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: .72rem;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}

/* ── Controls ── */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.btn-icon {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 9px;
  border-radius: 50%;
  transition: color .18s, background .18s;
}
.btn-icon:hover { color: var(--text); background: var(--surface-2); }
.btn-icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-icon.on { color: var(--accent); }

.btn-play {
  width: 58px; height: 58px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 18px var(--accent-glow);
  transition: transform .15s, box-shadow .2s;
}
.btn-play:hover { transform: scale(1.06); box-shadow: 0 6px 24px var(--accent-glow); }
.btn-play:active { transform: scale(.95); }
.btn-play:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ── Volume ── */
.vol-row {
  display: flex;
  align-items: center;
  gap: 9px;
}
.vol-icon { color: var(--text-2); flex-shrink: 0; }
.vol-bar { height: 3px; flex: 1; }
.vol-bar::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 99px;
  background: linear-gradient(
    to right,
    var(--text-2) 0%,
    var(--text-2) var(--vpct, 80%),
    var(--border) var(--vpct, 80%),
    var(--border) 100%
  );
}
.vol-bar::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  margin-top: -4.5px;
  background: var(--text-2);
  border-radius: 50%;
  transition: background .2s;
}
.vol-bar::-webkit-slider-thumb:hover { background: var(--accent); }
.vol-bar::-moz-range-track { height: 3px; border-radius: 99px; background: var(--border); }
.vol-bar::-moz-range-progress { height: 3px; border-radius: 99px; background: var(--text-2); }
.vol-bar::-moz-range-thumb {
  width: 12px; height: 12px;
  background: var(--text-2);
  border: none;
  border-radius: 50%;
}

/* ── Note ── */
.note-card {
  background: var(--note-bg);
  border: 1px solid var(--note-border);
  border-radius: 20px;
  padding: 18px 20px 20px;
}
.note-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-2);
  margin-bottom: 10px;
}
.note-label svg { flex-shrink: 0; }
.note-text {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: .96rem;
  line-height: 1.7;
  color: var(--text);
  transition: opacity .28s;
}
.note-text.fade { opacity: 0; }

/* ── Dedicatoria ── */
.dedicatoria {
  text-align: center;
  padding: 4px 0 2px;
}
.dedicatoria-text {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: .95rem;
  color: var(--text-2);
  line-height: 1.5;
}
.dedicatoria-heart {
  display: inline-block;
  color: var(--accent);
  font-size: 1rem;
  margin: 0 3px;
  animation: heartbeat 2.2s ease-in-out infinite;
}
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  14%       { transform: scale(1.2); }
  28%       { transform: scale(1); }
  42%       { transform: scale(1.15); }
  56%       { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .dedicatoria-heart { animation: none; }
}

/* ── Playlist ── */
.playlist {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.pl-header {
  padding: 13px 20px;
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-2);
  border-bottom: 1px solid var(--border);
}
.pl-list {
  list-style: none;
  max-height: 300px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.pl-list::-webkit-scrollbar { width: 4px; }
.pl-list::-webkit-scrollbar-track { background: transparent; }
.pl-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.pl-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 20px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .14s;
}
.pl-item:last-child { border-bottom: none; }
.pl-item:hover { background: var(--surface-2); }
.pl-item.active { background: var(--surface-2); }
.pl-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.pl-num {
  font-size: .73rem;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  width: 18px;
  text-align: center;
  flex-shrink: 0;
}
.pl-item.active .pl-num { color: var(--accent); }

.pl-thumb {
  width: 42px; height: 42px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}
.pl-info { flex: 1; min-width: 0; }
.pl-title {
  font-size: .875rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.pl-item.active .pl-title { color: var(--accent); }
.pl-artist {
  font-size: .75rem;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>

</head>

</div>
</div><!-- /wrap -->
</div><!-- /scroll-area -->

<!-- Barra de navegacion inferior -->

// ═══════════════════════════════════════════════════

let cur = 0, playing = false, shuffle = false, repeat = false;

const audio        = document.getElementById('audioEl');
const coverImg     = document.getElementById('coverImg');
const songTitle    = document.getElementById('songTitle');
const songArtist   = document.getElementById('songArtist');
const noteText     = document.getElementById('noteText');
const seekBar      = document.getElementById('seekBar');
const elapsed      = document.getElementById('timeElapsed');
const duration     = document.getElementById('timeDuration');
const volBar       = document.getElementById('volBar');
const btnPlay      = document.getElementById('btnPlay');
const playIconPath = document.getElementById('playIconPath');  // el <path>, no el <svg>
const btnShuffle   = document.getElementById('btnShuffle');
const btnRepeat    = document.getElementById('btnRepeat');
const plList       = document.getElementById('plList');
const navPlayer    = document.getElementById('navPlayer');
const navPlaylist  = document.getElementById('navPlaylist');
const viewPlayer   = document.getElementById('viewPlayer');
const viewPlaylist = document.getElementById('viewPlaylist');

const PLAY_PATH  = 'M8 5v14l11-7z';
const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

// ── Navegacion entre vistas ──
function showView(view) {
  viewPlayer.classList.toggle('active', view === 'player');
  viewPlaylist.classList.toggle('active', view === 'playlist');
  navPlayer.classList.toggle('active', view === 'player');
  navPlaylist.classList.toggle('active', view === 'playlist');
}
navPlayer.addEventListener('click', () => showView('player'));
navPlaylist.addEventListener('click', () => showView('playlist'));

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

function updateSeekFill() {
  const pct = seekBar.max > 0 ? (seekBar.value / seekBar.max * 100).toFixed(1) + '%' : '0%';
  seekBar.style.setProperty('--pct', pct);
}

function updateVolFill() {
  const pct = (volBar.value * 100).toFixed(1) + '%';
  volBar.style.setProperty('--vpct', pct);
}

function loadSong(i, autoplay) {
  const s = songs[i];
  // fade cover
  coverImg.classList.add('fade');
  setTimeout(() => {
    coverImg.src = s.cover;
    coverImg.alt = `${s.title} — ${s.artist}`;
    coverImg.classList.remove('fade');
  }, 200);
  songTitle.textContent  = s.title;
  songArtist.textContent = s.artist;
  // fade note
  noteText.classList.add('fade');
  setTimeout(() => {
    noteText.textContent = s.note;
    noteText.classList.remove('fade');
  }, 200);
  audio.src = s.src;
  seekBar.value = 0;
  updateSeekFill();
  elapsed.textContent  = '0:00';
  duration.textContent = '0:00';
  updatePlaylist();
  if (autoplay) audio.play().catch(() => {});
}

function updatePlaylist() {
  plList.querySelectorAll('.pl-item').forEach((el, i) => {
    el.classList.toggle('active', i === cur);
    el.querySelector('.pl-num').textContent = i === cur ? '▶' : (i + 1);
  });
}

function setPlayState(state) {
  playing = state;
  playIconPath.setAttribute('d', state ? PAUSE_PATH : PLAY_PATH);
}

function next() {
  cur = shuffle
    ? (songs.length > 1 ? (() => { let n; do { n = Math.floor(Math.random()*songs.length); } while(n===cur); return n; })() : 0)
    : (cur + 1) % songs.length;
  loadSong(cur, playing);
}

function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  cur = (cur - 1 + songs.length) % songs.length;
  loadSong(cur, playing);
}

// Audio events
audio.addEventListener('play',  () => setPlayState(true));
audio.addEventListener('pause', () => setPlayState(false));
audio.addEventListener('ended', () => {
  if (repeat) { audio.currentTime = 0; audio.play().catch(()=>{}); }
  else next();
});
audio.addEventListener('loadedmetadata', () => { duration.textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  seekBar.value = pct;
  updateSeekFill();
  elapsed.textContent = fmt(audio.currentTime);
});

// Controls
btnPlay.addEventListener('click', () => {
  playing ? audio.pause() : audio.play().catch(() => {});
});
document.getElementById('btnNext').addEventListener('click', next);
document.getElementById('btnPrev').addEventListener('click', prev);

btnShuffle.addEventListener('click', () => {
  shuffle = !shuffle;
  btnShuffle.classList.toggle('on', shuffle);
});
btnRepeat.addEventListener('click', () => {
  repeat = !repeat;
  btnRepeat.classList.toggle('on', repeat);
});

seekBar.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
  updateSeekFill();
});

volBar.addEventListener('input', () => {
  audio.volume = volBar.value;
  updateVolFill();
});
audio.volume = volBar.value;
updateVolFill();

// Build playlist
songs.forEach((s, i) => {
  const li = document.createElement('li');
  li.className = 'pl-item';
  li.tabIndex = 0;
  li.setAttribute('role', 'button');
  li.setAttribute('aria-label', `Reproducir ${s.title}`);
  li.innerHTML = `
    <span class="pl-num">${i+1}</span>
    <img class="pl-thumb" src="${s.cover}" alt="" loading="lazy">
    <div class="pl-info">
      <div class="pl-title">${s.title}</div>
      <div class="pl-artist">${s.artist}</div>
    </div>`;
  li.addEventListener('click', () => { cur = i; loadSong(i, true); showView('player'); });
  li.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); li.click(); } });
  plList.appendChild(li);
});

// Init
loadSong(0, false);
</script>
